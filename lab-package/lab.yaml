id: path-traversal
name: Reading Arbitrary Files via Path Traversal
version: 1.0.0

description: Local isolated Path Traversal security experiment

runtime:
  mode: CONTAINER

execution:
  compose_file: docker-compose.yml
  service: path-traversal-target

target:
  url: http://localhost:3000
  port: 3000

resources:
  memory: 256m
  cpus: 0.5

controls:
  start: scripts/start.bat
  stop: scripts/stop.bat
  reset: scripts/reset.bat